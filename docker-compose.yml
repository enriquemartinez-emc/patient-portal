services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    # Loopback only, so the API and web app can run on the host for local development.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      # The browser reaches Keycloak at localhost:8080 and containers at keycloak:8080. The public
      # URL fixes the token issuer; the dynamic backchannel makes the JWKS URL follow the caller.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_PORTAL_WEB_SECRET: ${KEYCLOAK_PORTAL_WEB_SECRET}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrations:
    build:
      context: ./api
      target: migrations
    environment:
      MIGRATIONS_CONNECTION_STRING: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD}
      WEB_ROLE_PASSWORD: ${WEB_ROLE_PASSWORD}
      MIGRATIONS_INCLUDE_DEV_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB};Username=patient_portal_app;Password=${APP_ROLE_PASSWORD}
      # Keys come from the internal address; the issuer is the public one (see keycloak below).
      Authentication__MetadataAddress: http://keycloak:8080/realms/patient-portal/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:8080/realms/patient-portal
      Authentication__Audience: portal-api
      Authentication__RequireHttpsMetadata: "false"
    depends_on:
      migrations:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      target: web
    environment:
      API_BASE_URL: http://api:8080
      # Public address of this app: where Keycloak sends the browser back after sign-in.
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      WEB_DATABASE_URL: postgres://patient_portal_web:${WEB_ROLE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Internal address; Keycloak's discovery document supplies the public addresses.
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/patient-portal
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_PORTAL_WEB_SECRET}
      # Lists the demo users on the sign-in page.
      SHOW_DEMO_ACCOUNTS: "true"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
